    <!-- Theme: "toggle" remembers the visitor's choice, otherwise follow the OS.
         Without JS the CSS follows prefers-color-scheme on its own. -->
    <script>
      (function (d, mode) {
        var root = d.documentElement, key = "theme-storage", theme;
        try { if (mode === "toggle") theme = localStorage.getItem(key); } catch (e) {}
        if (theme !== "light" && theme !== "dark")
          theme = mode === "light" || mode === "dark" ? mode
            : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        root.className = "js " + theme;
        d.addEventListener("click", function (e) {
          if (!e.target.closest("#dark-mode-toggle")) return;
          theme = root.classList.contains("dark") ? "light" : "dark";
          root.className = "js " + theme;
          try { localStorage.setItem(key, theme); } catch (e) {}
        });
      })(document, "toggle");
    </script>

    <!-- Load Styles -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
